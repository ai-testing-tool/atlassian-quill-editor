name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout editor
        uses: actions/checkout@v4

      # Install from source while npm staged review blocks the registry package.
      # Path stays inside $GITHUB_WORKSPACE (../ is not reliable with actions/checkout).
      - name: Checkout atlassian-adf-lite
        uses: actions/checkout@v4
        with:
          repository: ai-testing-tool/atlassian-adf-lite
          ref: v0.1.3
          path: atlassian-adf-lite

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build atlassian-adf-lite
        working-directory: atlassian-adf-lite
        run: |
          npm install
          npm run build

      - name: Install editor dependencies
        run: |
          npm pkg set 'dependencies.@ai-testing-tool/atlassian-adf-lite=file:./atlassian-adf-lite'
          npm install

      - name: Build Storybook
        env:
          # Project site: https://ai-testing-tool.github.io/atlassian-quill-editor/
          STORYBOOK_BASE_PATH: /atlassian-quill-editor/
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
